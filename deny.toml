[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
unlicensed = "deny"
allow = ["AGPL-3.0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
