name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '11 5 * * 3'
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analysis:
    # Scorecard publishing is available for public repositories.
    if: ${{ !github.event.repository.private }}
    uses: ossf/scorecard/.github/workflows/scorecard.yml@0864cf19026789058feabb7e87baa5f140aac736 # v2.4.3
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    with:
      results_file: results.sarif
      results_format: sarif
      publish_results: true
