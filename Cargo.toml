[package]
name = "gamepad-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Linux physical gamepad discovery and native evdev capture"
repository = "https://github.com/anderstvoss/gamepadcapture"

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
