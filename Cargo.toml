[package]
name = "gamepad-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Linux physical gamepad discovery and native evdev capture"
repository = "https://github.com/anderstvoss/gamepadcapture"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
nix = { version = "0.29.0", features = ["poll"] }

[features]
fixture-lab = []
hid = []
tester = ["dep:eframe", "hid"]

[[bin]]
name = "capture-lab"
path = "src/bin/capture-lab.rs"
required-features = ["fixture-lab"]

[[bin]]
name = "gamepad-tester"
path = "src/bin/gamepad-tester.rs"
required-features = ["tester"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
